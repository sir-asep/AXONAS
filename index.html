<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Dokumen Matrikulasi & Angkatan</title>
    <!-- Tailwind CSS CDN untuk styling modern -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome untuk Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Background Gradient Halus */
        .bg-gradient-custom {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
        }
        /* Glassmorphism Card Effect */
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        /* Hover Effect untuk Tombol Link */
        .link-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .link-card:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.12);
            border-color: rgba(99, 102, 241, 0.5);
            box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.3);
        }
    </style>
</head>
<body class="bg-gradient-custom min-h-screen text-slate-100 flex flex-col items-center justify-between p-4 sm:p-6">

    <!-- Container Utama -->
    <main class="w-full max-w-md mx-auto flex flex-col items-center pt-8 pb-6">
        
        <!-- Profile / Header Section -->
        <div class="flex flex-col items-center text-center mb-8 w-full">
            <!-- Foto / Avatar Angkatan -->
            <div class="relative mb-4">
                <div class="w-24 h-24 sm:w-28 sm:h-28 rounded-full bg-indigo-600/30 p-1 ring-2 ring-indigo-500/50 shadow-lg shadow-indigo-500/20 flex items-center justify-center overflow-hidden">
                    <!-- Icon default (Anda bisa ganti <img> di sini) -->
                    <i class="fa-solid fa-graduation-cap text-4xl text-indigo-400"></i>
                </div>
                <span class="absolute bottom-1 right-1 w-4 h-4 bg-emerald-500 border-2 border-slate-900 rounded-full" title="Aktif"></span>
            </div>

            <!-- Judul & Deskripsi -->
            <h1 class="text-2xl font-bold tracking-tight text-white mb-1">
                Angkatan Axonas & Spektrum 2026
            </h1>
            <p class="text-sm text-slate-400 max-w-xs font-normal">
                Pusat tautan dan dokumen resmi matrikulasi angkatan.
            </p>
        </div>

        <!-- Daftar Link / Buttons Section -->
        <div class="w-full flex flex-col gap-4">

            <!-- Link 1: Identitas Angkatan Axonas -->
            <a href="https://drive.google.com/file/d/1y1hv7qLkpnKPnGP0UXklkw4K3I2vmUkB/view?usp=sharing" 
               target="_blank" 
               rel="noopener noreferrer"
               class="link-card glass-card w-full p-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-lg bg-indigo-500/20 flex items-center justify-center text-indigo-400 group-hover:bg-indigo-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-id-card text-lg"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="font-semibold text-slate-100 text-sm sm:text-base group-hover:text-indigo-300 transition-colors">
                            Identitas Angkatan Axonas
                        </h2>
                        <p class="text-xs text-slate-400">Dokumen PDF (Google Drive)</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:text-indigo-400 transition-colors"></i>
            </a>

            <!-- Link 2: Matrikulasi Spektrum 2026 -->
            <a href="https://docs.google.com/document/d/1w0Je6Mc_xacirUSxVu91CLr48dGhJISSkDpfmE2sOkE/edit?usp=sharing" 
               target="_blank" 
               rel="noopener noreferrer"
               class="link-card glass-card w-full p-4 rounded-xl flex items-center justify-between group">
                <div class="flex items-center gap-3.5">
                    <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center text-blue-400 group-hover:bg-blue-500 group-hover:text-white transition-colors">
                        <i class="fa-solid fa-file-word text-lg"></i>
                    </div>
                    <div class="text-left">
                        <h2 class="font-semibold text-slate-100 text-sm sm:text-base group-hover:text-blue-300 transition-colors">
                            Matrikulasi Spektrum 2026
                        </h2>
                        <p class="text-xs text-slate-400">Google Docs</p>
                    </div>
                </div>
                <i class="fa-solid fa-arrow-up-right-from-square text-xs text-slate-500 group-hover:text-blue-400 transition-colors"></i>
            </a>

        </div>

    </main>

    <!-- Footer Section -->
    <footer class="w-full text-center py-4 text-xs text-slate-500 border-t border-slate-800/50">
        <p>© 2026 Angkatan Axonas. Created for internal access.</p>
    </footer>

</body>
</html>
